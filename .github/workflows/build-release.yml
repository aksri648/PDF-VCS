name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar-name: pdf-vcs-backend-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-name: pdf-vcs-backend-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Bundle backend as sidecar binary
        working-directory: backend
        shell: bash
        run: |
          mkdir -p ../src-tauri/binaries
          npx esbuild src/server.ts --bundle --platform=node \
            --external:mongodb-memory-server --external:mongoose \
            --outfile=dist/bundle.js
          echo '{"main": "dist/bundle.js", "output": "dist/sea-prep.blob"}' > sea-config.json
          node --experimental-sea-config sea-config.json
          cp $(node -e "process.stdout.write(process.execPath)") ../src-tauri/binaries/${{ matrix.sidecar-name }}
          npx postject ../src-tauri/binaries/${{ matrix.sidecar-name }} NODE_SEA_BLOB \
            dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          rm -f sea-config.json dist/sea-prep.blob

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'PDF VCS ${{ github.ref_name }}'
          releaseBody: 'Native desktop build for ${{ matrix.os }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
